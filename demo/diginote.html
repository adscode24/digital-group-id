<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo DigiNote — Digital Group ID</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#faf6ef;color:#1f1b16;min-height:100vh}
.top{position:sticky;top:0;z-index:50;background:rgba(250,246,239,.85);backdrop-filter:blur(10px);border-bottom:1px solid #e9e0d2;padding:10px 18px;display:flex;gap:10px;align-items:center;font-size:14px}
.top a{color:#EA580C;font-weight:800;text-decoration:none}.pill{margin-left:auto;background:#FFEDD5;color:#C2410C;font-size:11px;font-weight:800;padding:4px 12px;border-radius:99px}
.phone{max-width:420px;margin:24px auto;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(31,27,22,.25);border:1px solid #e9e0d2;background:#faf6ef}
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(250,246,239,.9);border-bottom:1px solid #e9e0d2;position:sticky;top:0}
.hdr img{width:32px;height:32px;border-radius:10px}
.hdr b{font-size:15px}.hdr small{display:block;color:#EA580C;font-size:10px}
.hdr .ava{margin-left:auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#EA580C,#F59E0B);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.cnt{padding:16px 14px 90px}
.greet{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#EA580C;font-weight:800}
.greet h1{font-size:20px;margin:4px 0}
.greet p{font-size:12px;color:#6b6359}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kpi{background:#fff;border:1px solid #e9e0d2;border-radius:16px;padding:14px}
.kpi small{color:#6b6359;font-size:11px}.kpi strong{display:block;font-size:17px;margin-top:4px}
.panel{background:#fff;border:1px solid #e9e0d2;border-radius:20px;padding:16px;margin-bottom:12px}
.panel h3{font-size:14px;margin-bottom:10px}
label{font-size:11px;font-weight:700;color:#6b6359;display:grid;gap:5px;margin-bottom:9px}
input,select{width:100%;border:1px solid #e9e0d2;border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit;background:#fff}
button{width:100%;background:#EA580C;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
button:hover{background:#C2410C}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3ecdf;font-size:13px}
.tx small{color:#8a8175;display:block;font-size:11px}
.in{color:#10B981;font-weight:800}.out{color:#ef4444;font-weight:800}
.del{width:auto;background:#FEE2E2;color:#B91C1C;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:800}
.dock{position:sticky;bottom:14px;margin:0 12px;background:rgba(255,255,255,.75);backdrop-filter:blur(16px);border:1px solid #e9e0d2;border-radius:26px;padding:10px 6px;display:flex;justify-content:space-around;box-shadow:0 12px 30px rgba(31,27,22,.12);font-size:10px;font-weight:700;color:#8a8175}
.dock span{display:grid;gap:3px;text-align:center}
.dock .on{color:#EA580C}
.dock i{font-size:16px;font-style:normal}
</style>
</head>
<body>
<div class="top"><a href="../index.html">← Digital Group ID</a><b>📝 Demo DigiNote</b><span class="pill">LIVE DEMO</span></div>
<div class="phone">
  <div class="hdr">
    <img src="../assets/diginote-icon.png" onerror="this.style.display='none'" alt="">
    <div><b>DigiNote</b><small>Your Digital Note</small></div>
    <div class="ava">S</div>
  </div>
  <div class="cnt">
    <div class="greet">OKTOBER 2026
      <h1 id="salam">Selamat datang! 👋</h1>
      <p id="subsalam">Arus kas tercatat rapi hari ini.</p>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Saldo</small><strong id="saldo">—</strong></div>
      <div class="kpi"><small>Pemasukan</small><strong id="masuk" style="color:#10B981">—</strong></div>
      <div class="kpi"><small>Pengeluaran</small><strong id="keluar" style="color:#ef4444">—</strong></div>
      <div class="kpi"><small>Transaksi</small><strong id="jml">—</strong></div>
    </div>
    <div class="panel"><h3>＋ Catat Transaksi</h3>
      <form id="f">
        <div class="row"><label>Tipe<select id="tipe"><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select></label><label>Jumlah<input id="jml" type="number" min="1" required></label></div>
        <div class="row"><label>Kategori<select id="kat"><option>Makanan</option><option>Transport</option><option>Gaji</option><option>Belanja</option><option>Tagihan</option></select></label><label>Akun<select id="akun"><option>Tunai</option><option>Bank BCA</option><option>E-Wallet</option></select></label></div>
        <label>Catatan<input id="note" placeholder="Makan siang..."></label>
        <button>Simpan</button>
      </form>
    </div>
    <div class="panel"><h3>Transaksi Terbaru</h3><div id="list"></div></div>
  </div>
  <div style="padding:0 12px 14px"><div class="dock">
    <span class="on"><i>🏠</i>Beranda</span>
    <span><i>🧾</i>Transaksi</span>
    <span><i>👛</i>Dana</span>
    <span><i>💳</i>Hutang</span>
    <span><i>📅</i>Summary</span>
    <span><i>⚙️</i>Setelan</span>
  </div></div>
</div>
<script>
const K='dg_note_demo2';
const fmt=n=>'Rp '+Number(n).toLocaleString('id-ID');
let data=JSON.parse(localStorage.getItem(K)||'null')||[
 {tipe:'masuk',jml:5000000,kat:'Gaji',akun:'Bank BCA',tgl:'2026-10-01',note:'Gaji Oktober'},
 {tipe:'keluar',jml:45000,kat:'Makanan',akun:'Tunai',tgl:'2026-10-01',note:'Makan siang'},
 {tipe:'keluar',jml:120000,kat:'Transport',akun:'E-Wallet',tgl:'2026-10-02',note:'Bensin'}];
function save(){localStorage.setItem(K,JSON.stringify(data));render();}
function render(){let m=0,k=0;data.forEach(t=>t.tipe==='masuk'?m+=+t.jml:k+=+t.jml);
 document.getElementById('saldo').textContent=fmt(m-k);
 document.getElementById('masuk').textContent=fmt(m);
 document.getElementById('keluar').textContent=fmt(k);
 document.getElementById('jml').textContent=data.length+' item';
 document.getElementById('list').innerHTML=data.slice(-6).reverse().map((t,i)=>{
   document.getElementById('subsalam').textContent=t.note?data.length+' catatan hari ini':'Belum ada catatan.';
   return `<div class="tx"><div>${t.tipe==='masuk'?'🟢':'🔴'} <b>${t.skat||t.kat}</b><small>${t.akun} · ${t.tgl}${t.note?' · '+t.note:''}</small></div><span class="${t.tipe==='masuk'?'in':'out'}">${t.tipe==='masuk'?'+':'−'} ${fmt(t.jml)}</span></div>`;}).join('');
 const h=new Date().getHours();
 document.getElementById('salam').textContent=(h<10?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam')+'! 👋';
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();
 data.push({tipe:tipe.value,jml:+jml.value,kat:kat.value,akun:akun.value,tgl:new Date().toISOString().slice(0,10),note:note.value});
 e.target.reset();save();});
render();
</script>
</body>
</html>
